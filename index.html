
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codete</title>

<style>
:root {
  --bg: #09070f;
  --bg2: #100b1c;
  --panel: #151020;
  --panel2: #1d1530;
  --border: #302347;
  --text: #f1ecfa;
  --muted: #a69bbd;
  --purple: #a78bfa;
  --purple2: #7c3aed;
  --purple3: #c4b5fd;
  --red: #ff525c;
  --redbg: #2b1018;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  color: var(--text);
  background:
    radial-gradient(ellipse at 15% 10%, #25113e66, transparent 40%),
    radial-gradient(ellipse at 90% 90%, #30134a44, transparent 45%),
    var(--bg);
  font-family: Inter, system-ui, -apple-system, Arial, sans-serif;
}

/* =========================================================
   AMBIENT BACKGROUND
========================================================= */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 0%, #8b5cf612, transparent 50%);
}

#app {
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* =========================================================
   HEADER
========================================================= */

header {
  height: 76px;
  padding: 0 25px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #ffffff08;
  background: #0d0915cc;
  backdrop-filter: blur(14px);
  z-index: 5;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 13px;
  background: linear-gradient(135deg, #8b5cf6, #4c1d95);
  box-shadow: 0 0 22px #8b5cf633;
  font-weight: 900;
  font-size: 20px;
  position: relative;
  transition: transform .25s, box-shadow .25s;
}

.logo:hover {
  transform: translateY(-3px) rotate(-5deg);
  box-shadow: 0 0 35px #a78bfa88;
}

.logo::after {
  content: "^^";
  position: absolute;
  font-size: 11px;
  top: -12px;
  opacity: 0;
  transform: translateY(5px);
  transition: .2s;
  color: var(--purple3);
}

.logo:hover::after {
  opacity: 1;
  transform: translateY(0);
}

.brandName {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -.7px;
}

.brandName span {
  color: var(--purple);
}

.headerRight {
  display: flex;
  align-items: center;
  gap: 12px;
}

#model {
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  outline: none;
}

#accountBtn {
  color: var(--text);
  background: #1b1429;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
}

/* =========================================================
   CHAT
========================================================= */

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 30px 5%;
  scroll-behavior: smooth;
}

#chat::-webkit-scrollbar {
  width: 8px;
}

#chat::-webkit-scrollbar-thumb {
  background: #35234c;
  border-radius: 20px;
}

#empty {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -40%);
  text-align: center;
  width: 90%;
  max-width: 600px;
}

.emptyLogo {
  margin: 0 auto 22px;
  width: 76px;
  height: 76px;
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 900;
  background: linear-gradient(135deg, #8b5cf6, #4c1d95);
  box-shadow:
    0 0 40px #8b5cf633,
    inset 0 0 20px #ffffff10;
  animation: float 4s ease-in-out infinite;
}

#empty h1 {
  font-size: 35px;
  letter-spacing: -1px;
  margin-bottom: 10px;
}

#empty p {
  color: var(--muted);
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

/* =========================================================
   MESSAGE ALIGNMENT
========================================================= */

.messageRow {
  display: flex;
  width: 100%;
  margin-bottom: 28px;
  animation: appear .25s ease-out;
}

.messageRow.user {
  justify-content: flex-end;
}

.messageRow.assistant {
  justify-content: flex-start;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message {
  max-width: 78%;
  min-width: 100px;
  line-height: 1.65;
  overflow-wrap: anywhere;
}

.user .message {
  background: linear-gradient(145deg, #27173e, #21132f);
  border: 1px solid #513575;
  padding: 16px 20px;
  border-radius: 18px 18px 5px 18px;
  box-shadow: 0 8px 30px #00000015;
}

.assistant .message {
  padding: 6px 4px;
}

.messageLabel {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 8px;
  letter-spacing: .4px;
}

.user .messageLabel {
  text-align: right;
}

.assistant .messageLabel {
  display: flex;
  align-items: center;
  gap: 9px;
}

.miniLogo {
  width: 25px;
  height: 25px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #8b5cf6, #4c1d95);
  color: white;
  font-size: 12px;
  font-weight: 900;
  transition: .2s;
}

.miniLogo:hover {
  transform: scale(1.15) rotate(8deg);
  box-shadow: 0 0 18px #a78bfa66;
}

/* =========================================================
   ERROR PANEL
========================================================= */

.errorBlock {
  background: var(--redbg);
  color: #ffb8bd;
  border: 1px solid #a83340;
  border-left: 4px solid var(--red);
  border-radius: 10px;
  padding: 13px 15px;
  margin-top: 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  box-shadow: 0 0 18px #ff334408;
}

.errorTitle {
  font-weight: 800;
  color: #ff737c;
  margin-bottom: 6px;
  font-family: system-ui, sans-serif;
}

/* =========================================================
   THINKING
========================================================= */

.thinking {
  color: var(--purple3);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.thinkingDots {
  display: inline-flex;
  gap: 4px;
}

.thinkingDots span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--purple);
  animation: dot 1.2s infinite;
}

.thinkingDots span:nth-child(2) {
  animation-delay: .2s;
}

.thinkingDots span:nth-child(3) {
  animation-delay: .4s;
}

@keyframes dot {
  0%, 80%, 100% { opacity: .3; transform: translateY(0); }
  40% { opacity: 1; transform: translateY(-4px); }
}

/* =========================================================
   COMPOSER
========================================================= */

#composerArea {
  padding: 18px 5% 25px;
  background: linear-gradient(transparent, #09070fdd 25%);
}

#composer {
  max-width: 1050px;
  margin: auto;
  display: flex;
  gap: 12px;
  align-items: flex-end;
  padding: 14px;
  background: #151020;
  border: 1px solid #392653;
  border-radius: 18px;
  box-shadow: 0 0 35px #6d28d910;
  transition: border-color .2s, box-shadow .2s;
}

#composer:focus-within {
  border-color: #7753a5;
  box-shadow: 0 0 35px #8b5cf620;
}

#input {
  flex: 1;
  resize: none;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text);
  min-height: 42px;
  max-height: 200px;
  padding: 10px;
  font-size: 15px;
}

#input::placeholder {
  color: #81758f;
}

#send {
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #8b5cf6, #6d28d9);
  color: white;
  font-size: 20px;
  font-weight: 800;
  transition: .2s;
}

#send:hover {
  box-shadow: 0 0 25px #8b5cf655;
  transform: translateY(-2px);
}

#send:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#footnote {
  text-align: center;
  color: #746783;
  font-size: 11px;
  margin-top: 12px;
}

/* =========================================================
   MODAL
========================================================= */

#modal {
  position: fixed;
  inset: 0;
  background: #000b;
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
}

#modalBox {
  background: linear-gradient(160deg, #1b1428, #120d1c);
  border: 1px solid #392653;
  width: 100%;
  max-width: 460px;
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 25px 90px #0009;
}

#modalBox h2 {
  margin-top: 0;
  font-size: 25px;
}

#modalContent input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  background: #0e0b15;
  color: var(--text);
  border: 1px solid #392653;
  border-radius: 11px;
  outline: none;
}

#modalContent input:focus {
  border-color: var(--purple);
  box-shadow: 0 0 15px #8b5cf622;
}

#modalNote {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}

.modalButtons {
  display: flex;
  gap: 10px;
  margin-top: 18px;
  flex-wrap: wrap;
}

.modalButtons button {
  flex: 1;
  min-width: 100px;
  color: var(--text);
  background: #241936;
  border: 1px solid #392653;
  border-radius: 11px;
  padding: 12px;
  cursor: pointer;
  transition: .2s;
}

.modalButtons button:hover {
  background: #33234c;
}

.modalLink {
  background: none;
  border: none;
  color: var(--purple3);
  cursor: pointer;
  padding: 12px 0 0;
  text-decoration: underline;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px) {
  header {
    padding: 0 12px;
    height: 68px;
  }

  .brandName {
    font-size: 18px;
  }

  .logo {
    width: 36px;
    height: 36px;
  }

  #model {
    max-width: 155px;
    padding: 8px;
  }

  #chat {
    padding: 20px 15px;
  }

  .message {
    max-width: 95%;
  }

  #composerArea {
    padding: 12px 12px 20px;
  }

  #empty h1 {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<div id="app">

<header>
  <div class="brand">
    <div class="logo" title="Codete">C</div>
    <div class="brandName">Code<span>te</span></div>
  </div>

  <div class="headerRight">
    <select id="model">
      <option value="Codete 1.0">Codete 1.0</option>
      <option value="Codete Advanced 1.0">Codete Advanced 1.0</option>
    </select>

    <button id="accountBtn">Sign in</button>
  </div>
</header>

<section id="chat">

  <div id="empty">
    <div class="emptyLogo">C</div>
    <h1>Where should we begin?</h1>
    <p>Build, explore, debug, and create with Codete.</p>
  </div>

</section>

<div id="composerArea">
  <div id="composer">
    <textarea id="input" placeholder="Message Codete..." rows="1"></textarea>
    <button id="send" title="Send">↑</button>
  </div>
  <div id="footnote">Codete can make mistakes. Review generated code.</div>
</div>

</div>

<div id="modal">
  <div id="modalBox">
    <h2 id="modalTitle">Account</h2>
    <div id="modalContent"></div>
    <div id="modalLinkRow"></div>
    <div class="modalButtons" id="modalButtons"></div>
  </div>
</div>

<script>
/* =========================================================
   CONFIGURATION
========================================================= */

const RELAY_URL =
  "https://raw.githubusercontent.com/CodeteAI/Codete/refs/heads/main/relay.txt";

let discoveredBackend = "";
let apiKey = sessionStorage.getItem("codete_api_key") || "";
let accountName = sessionStorage.getItem("codete_account") || "";
let messages = [];
let busy = false;

/* =========================================================
   BACKEND
========================================================= */

function normalizeBackend(url) {
  url = (url || "").trim().replace(/\/+$/, "");

  if (!url) return "";

  url = url.replace(/\/v1$/i, "");

  return url + "/v1";
}

function base() {
  return normalizeBackend(discoveredBackend);
}

function updateStatus(text) {
  console.log("Codete:", text);
}

async function discoverBackend() {
  updateStatus("Discovering backend");

  try {
    const response = await fetch(RELAY_URL, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Relay HTTP " + response.status);
    }

    const relayText = (await response.text()).trim();

    if (!relayText) {
      throw new Error("Relay file is empty");
    }

    if (relayText.includes("/relay.txt")) {
      throw new Error("Relay file contains an invalid backend URL");
    }

    discoveredBackend = relayText.replace(/\/+$/, "");

    console.log("Backend discovered:", base());

  } catch (error) {
    console.error("Relay discovery failed:", error);
    updateStatus("Relay discovery failed");
  }
}

/* =========================================================
   API HELPER
========================================================= */

async function apiFetch(path, options = {}) {
  if (!base()) {
    throw new Error("Backend is not available yet.");
  }

  const url = base() + "/" + path.replace(/^\/+/, "");

  const headers = new Headers(options.headers || {});

  if (apiKey) {
    headers.set("Authorization", "Bearer " + apiKey);
  }

  if (options.body && !headers.has("Content-Type")) {
    headers.set("Content-Type", "application/json");
  }

  try {
    return await fetch(url, {
      ...options,
      headers
    });
  } catch (error) {
    if (error instanceof TypeError) {
      throw new Error(
        "Network or CORS error. The gateway may be unavailable."
      );
    }

    throw error;
  }
}

/* =========================================================
   ERROR PARSING
========================================================= */

function extractError(data) {
  if (!data) return "Unknown error";

  if (typeof data === "string") {
    return data;
  }

  if (data.detail) {
    if (typeof data.detail === "string") {
      return data.detail;
    }

    return JSON.stringify(data.detail, null, 2);
  }

  if (data.error) {
    if (typeof data.error === "string") {
      return data.error;
    }

    return JSON.stringify(data.error, null, 2);
  }

  if (data.message) {
    return data.message;
  }

  return JSON.stringify(data, null, 2);
}

async function parseResponse(response) {
  const text = await response.text();

  let data;

  try {
    data = text ? JSON.parse(text) : {};
  } catch {
    data = { detail: text };
  }

  if (!response.ok) {
    throw new Error(extractError(data));
  }

  return data;
}

/* =========================================================
   MESSAGE RENDERING
========================================================= */

function removeEmpty() {
  const empty = document.getElementById("empty");

  if (empty) {
    empty.remove();
  }
}

function createMessage(role, content = "") {
  removeEmpty();

  const chat = document.getElementById("chat");

  const row = document.createElement("div");
  row.className = "messageRow " + role;

  const box = document.createElement("div");
  box.className = "message";

  const label = document.createElement("div");
  label.className = "messageLabel";

  if (role === "user") {
    label.textContent = "You";
  } else {
    const icon = document.createElement("div");
    icon.className = "miniLogo";
    icon.textContent = "C";
    icon.title = "Codete";

    const name = document.createElement("span");
    name.textContent = "Codete";

    label.appendChild(icon);
    label.appendChild(name);
  }

  const body = document.createElement("div");
  body.className = "messageBody";
  body.textContent = content;

  box.appendChild(label);
  box.appendChild(body);

  row.appendChild(box);
  chat.appendChild(row);

  chat.scrollTop = chat.scrollHeight;

  return {
    row,
    box,
    body
  };
}

function addMessage(role, content) {
  return createMessage(role, content).body;
}

function addErrorMessage(messageObject, errorText) {
  messageObject.body.textContent = "";

  const error = document.createElement("div");
  error.className = "errorBlock";

  const title = document.createElement("div");
  title.className = "errorTitle";
  title.textContent = "Codete encountered an error";

  const text = document.createElement("div");
  text.textContent = errorText;

  error.appendChild(title);
  error.appendChild(text);

  messageObject.body.appendChild(error);

  document.getElementById("chat").scrollTop =
    document.getElementById("chat").scrollHeight;
}

/* =========================================================
   THINKING INDICATOR
========================================================= */

function showThinking(messageObject) {
  messageObject.body.textContent = "";

  const thinking = document.createElement("div");
  thinking.className = "thinking";

  const text = document.createElement("span");
  text.textContent = "Thinking";

  const dots = document.createElement("div");
  dots.className = "thinkingDots";

  for (let i = 0; i < 3; i++) {
    const dot = document.createElement("span");
    dots.appendChild(dot);
  }

  thinking.appendChild(text);
  thinking.appendChild(dots);

  messageObject.body.appendChild(thinking);
}

/* =========================================================
   CHAT
========================================================= */

function newChat() {
  messages = [];

  document.getElementById("chat").innerHTML = `
    <div id="empty">
      <div class="emptyLogo">C</div>
      <h1>Where should we begin?</h1>
      <p>Build, explore, debug, and create with Codete.</p>
    </div>
  `;
}

const input = document.getElementById("input");

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

async function sendMessage() {
  if (busy) return;

  const text = input.value.trim();

  if (!text) return;

  if (!apiKey) {
    openAuth("signin");
    return;
  }

  if (!base()) {
    alert("Backend has not been discovered yet.");
    return;
  }

  busy = true;
  document.getElementById("send").disabled = true;

  input.value = "";
  input.style.height = "auto";

  addMessage("user", text);

  messages.push({
    role: "user",
    content: text
  });

  const assistantMessage = createMessage("assistant");
  showThinking(assistantMessage);

  try {
    const response = await apiFetch("chat/completions", {
      method: "POST",
      body: JSON.stringify({
        model: document.getElementById("model").value,
        messages: messages
      })
    });

    const tokensUsed = response.headers.get("X-Codete-Tokens-Used");
    const tokensLeft = response.headers.get("X-Codete-Tokens-Left");

    const data = await parseResponse(response);

    let reply = "";

    if (data.choices && data.choices.length > 0) {
      reply = data.choices[0].message?.content || "";
    } else {
      reply = data.response || data.message || JSON.stringify(data);
    }

    assistantMessage.body.textContent = reply || "(Empty response)";

    messages.push({
      role: "assistant",
      content: reply
    });

    if (tokensUsed !== null || tokensLeft !== null) {
      updateStatus(
        "Tokens used: " + (tokensUsed ?? "?") +
        " · Remaining: " + (tokensLeft ?? "?")
      );
    }

  } catch (error) {
    const errorText = error.message || String(error);

    addErrorMessage(assistantMessage, errorText);

    // Do not preserve failed requests in conversation history.
    messages.pop();

    console.error(error);

  } finally {
    busy = false;
    document.getElementById("send").disabled = false;
    input.focus();
  }
}

document.getElementById("send").onclick = sendMessage;

/* =========================================================
   AUTH MODAL
========================================================= */

function openModal(title, content, buttons, linkContent = "") {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalContent").innerHTML = content;
  document.getElementById("modalLinkRow").innerHTML = linkContent;

  const buttonArea = document.getElementById("modalButtons");
  buttonArea.innerHTML = "";

  for (const button of buttons) {
    const b = document.createElement("button");
    b.textContent = button.label;
    b.onclick = button.action;

    buttonArea.appendChild(b);
  }

  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function openAuth(mode = "signin") {
  const signup = mode === "signup";

  openModal(
    signup ? "Create account" : "Sign in",
    `
      <input
        id="authEmail"
        type="email"
        placeholder="Email address"
        autocomplete="email"
      >

      <input
        id="authPassword"
        type="password"
        placeholder="Password"
        autocomplete="${signup ? "new-password" : "current-password"}"
      >

      <p id="modalNote">
        Authentication is handled by the Codete gateway.
      </p>
    `,
    [
      {
        label: signup ? "Sign up" : "Sign in",
        action: submitAuth
      },
      {
        label: signup ? "Switch to sign in" : "Create account",
        action: () => openAuth(signup ? "signin" : "signup")
      },
      {
        label: "Cancel",
        action: closeModal
      }
    ],
    signup ? "" : `
      <button class="modalLink" onclick="openForgotPassword()">
        Forgot password?
      </button>
    `
  );

  document.getElementById("authEmail").focus();
}

/* =========================================================
   SIGNUP / SIGNIN
========================================================= */

async function submitAuth() {
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;

  if (!email || !password) {
    alert("Enter your email and password.");
    return;
  }

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    alert("Please enter a valid email address.");
    return;
  }

  const signupMode =
    document.getElementById("modalTitle").textContent === "Create account";

  const endpoint = signupMode ? "auth/signup" : "auth/signin";

  try {
    const response = await apiFetch(endpoint, {
      method: "POST",
      body: JSON.stringify({
        email: email,
        password: password
      })
    });

    const data = await parseResponse(response);

    const key =
      data.api_key ||
      data.token ||
      data.access_token;

    if (!key) {
      throw new Error("Server did not return an API key.");
    }

    apiKey = key;
    accountName = data.email || email;

    sessionStorage.setItem("codete_api_key", apiKey);
    sessionStorage.setItem("codete_account", accountName);

    closeModal();
    updateAccount();

  } catch (error) {
    alert(error.message);
  }
}

/* =========================================================
   PASSWORD RECOVERY
========================================================= */

function openForgotPassword() {
  openModal(
    "Reset password",
    `
      <input
        id="recoveryEmail"
        type="email"
        placeholder="Account email"
        autocomplete="email"
      >

      <p id="modalNote">
        PlayFab will handle password recovery if it is configured
        for your account.
      </p>
    `,
    [
      {
        label: "Send recovery email",
        action: sendRecoveryEmail
      },
      {
        label: "Back to sign in",
        action: () => openAuth("signin")
      },
      {
        label: "Cancel",
        action: closeModal
      }
    ]
  );

  document.getElementById("recoveryEmail").focus();
}

async function sendRecoveryEmail() {
  const email = document.getElementById("recoveryEmail").value.trim();

  if (!email) {
    alert("Enter your email address.");
    return;
  }

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    alert("Please enter a valid email address.");
    return;
  }

  try {
    const response = await apiFetch("auth/forgot-password", {
      method: "POST",
      body: JSON.stringify({
        email: email
      })
    });

    const data = await parseResponse(response);

    closeModal();

    alert(
      data.message ||
      "If an account is associated with that email, a recovery email may be sent."
    );

  } catch (error) {
    alert(error.message);
  }
}

/* =========================================================
   ACCOUNT
========================================================= */

function updateAccount() {
  const button = document.getElementById("accountBtn");

  button.textContent = apiKey
    ? accountName || "Account"
    : "Sign in";
}

document.getElementById("accountBtn").onclick = () => {
  if (!apiKey) {
    openAuth("signin");
    return;
  }

  openModal(
    "Account",
    `<p>Signed in as <strong>${escapeHTML(accountName)}</strong></p>`,
    [
      {
        label: "Sign out",
        action: () => {
          apiKey = "";
          accountName = "";

          sessionStorage.removeItem("codete_api_key");
          sessionStorage.removeItem("codete_account");

          updateAccount();
          closeModal();
        }
      },
      {
        label: "Close",
        action: closeModal
      }
    ]
  );
};

/* =========================================================
   HTML ESCAPING
========================================================= */

function escapeHTML(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* =========================================================
   STARTUP
========================================================= */

updateAccount();
discoverBackend();

</script>
