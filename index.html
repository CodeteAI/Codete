
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codete</title>
<style>
:root {
  --bg: #101114;
  --panel: #191a20;
  --panel2: #22232b;
  --text: #eeeeef;
  --muted: #999ba6;
  --accent: #8b83ff;
  --border: #30313a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  height: 100vh;
  display: flex;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, Arial, sans-serif;
}
button, input, textarea { font: inherit; }
button {
  cursor: pointer;
  color: var(--text);
  border: 1px solid var(--border);
  background: var(--panel2);
  border-radius: 8px;
  padding: 10px 14px;
}
button:hover { filter: brightness(1.15); }
button:disabled { opacity: .5; cursor: not-allowed; }

#sidebar {
  width: 250px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 18px;
  gap: 14px;
}
.logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -1px;
}
.logo span { color: var(--accent); }
#newChat { width: 100%; }
#sidebarBottom {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
#topbar {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
#topbar select {
  color: var(--text);
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
}
#status {
  font-size: 12px;
  color: var(--muted);
  overflow-wrap: anywhere;
}
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}
.message {
  max-width: 850px;
  margin: 0 auto 22px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.message.user {
  background: var(--panel2);
  border: 1px solid var(--border);
  padding: 15px;
  border-radius: 14px;
}
.message.assistant { padding: 10px 4px; }
.message .role {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 8px;
  font-weight: 700;
}
#empty {
  text-align: center;
  margin: 12vh auto;
  max-width: 650px;
  color: var(--muted);
}
#empty h1 {
  color: var(--text);
  font-size: 32px;
}
#composerArea { padding: 15px 20px 20px; }
#composer {
  max-width: 850px;
  margin: auto;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 12px;
  border-radius: 16px;
}
#input {
  flex: 1;
  resize: none;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text);
  min-height: 40px;
  max-height: 180px;
  padding: 10px;
}
#send {
  background: var(--accent);
  border: none;
  color: white;
  font-weight: bold;
}
#footnote {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  margin-top: 10px;
}

#modal {
  position: fixed;
  inset: 0;
  background: #000a;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#modalBox {
  background: var(--panel);
  border: 1px solid var(--border);
  width: 100%;
  max-width: 460px;
  border-radius: 16px;
  padding: 24px;
}
#modalBox h2 { margin-top: 0; }
#modalContent input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.modalButtons {
  display: flex;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.modalButtons button { flex: 1; }
#modalNote {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}
.modalLink {
  background: none;
  border: none;
  color: var(--accent);
  padding: 8px 0;
  text-decoration: underline;
}
#modalLinkRow { text-align: left; }

@media(max-width:650px) {
  #sidebar { width: 65px; padding: 12px 8px; }
  #sidebar .logo { font-size: 17px; text-align: center; }
  #sidebar .sideText { display: none; }
  #chat { padding: 14px; }
  #topbar { padding: 12px; }
}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="logo">Code<span>te</span></div>
  <button id="newChat">+ <span class="sideText">New chat</span></button>
  <div id="sidebarBottom">
    <button id="accountBtn">Sign in</button>
    <button id="settingsBtn">Backend settings</button>
  </div>
</aside>

<main id="main">
  <header id="topbar">
    <select id="model">
      <option value="Codete 1.0">Codete 1.0</option>
      <option value="Codete Advanced 1.0">Codete Advanced 1.0</option>
    </select>
    <div id="status">Discovering backend...</div>
  </header>

  <section id="chat">
    <div id="empty">
      <h1>What are we building?</h1>
      <p>Start a conversation with Codete.</p>
    </div>
  </section>

  <div id="composerArea">
    <div id="composer">
      <textarea id="input" placeholder="Ask Codete anything..." rows="1"></textarea>
      <button id="send">Send</button>
    </div>
    <div id="footnote">Codete may make mistakes. Review generated code.</div>
  </div>
</main>

<div id="modal">
  <div id="modalBox">
    <h2 id="modalTitle">Account</h2>
    <div id="modalContent"></div>
    <div id="modalLinkRow"></div>
    <div class="modalButtons" id="modalButtons"></div>
  </div>
</div>

<script>
/* =========================================================
   CONFIG
========================================================= */

const RELAY_URL =
  "https://raw.githubusercontent.com/CodeteAI/Codete/refs/heads/main/relay.txt";

let discoveredBackend = "";
let apiKey = sessionStorage.getItem("codete_api_key") || "";
let accountName = sessionStorage.getItem("codete_account") || "";
let messages = [];
let busy = false;

/* =========================================================
   BACKEND URL NORMALIZATION
========================================================= */

function normalizeBackend(url) {
  url = (url || "").trim().replace(/\/+$/, "");

  if (!url) return "";

  // Strip an existing /v1 to prevent duplicate /v1/v1
  url = url.replace(/\/v1$/i, "");

  return url + "/v1";
}

function base() {
  const override = localStorage.getItem("codete_base");

  if (override) return normalizeBackend(override);

  return normalizeBackend(discoveredBackend);
}

function updateStatus(text) {
  document.getElementById("status").textContent = text;
}

function showBackendStatus() {
  if (base()) {
    updateStatus("Backend: " + base());
  } else {
    updateStatus("Backend unavailable");
  }
}

/* =========================================================
   RELAY DISCOVERY
========================================================= */

async function discoverBackend() {
  updateStatus("Discovering backend...");

  try {
    const response = await fetch(RELAY_URL, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Relay HTTP " + response.status);
    }

    const relayText = (await response.text()).trim();

    if (!relayText) {
      throw new Error("Relay file is empty");
    }

    if (relayText.includes("/relay.txt")) {
      throw new Error("Relay contains an invalid URL");
    }

    discoveredBackend = relayText.replace(/\/+$/, "");

    showBackendStatus();

    console.log("Codete backend:", base());

  } catch (error) {
    console.error("Relay discovery failed:", error);

    if (localStorage.getItem("codete_base")) {
      showBackendStatus();
    } else {
      updateStatus("Relay failed. Configure backend manually.");
    }
  }
}

/* =========================================================
   API
========================================================= */

async function apiFetch(path, options = {}) {
  const backend = base();

  if (!backend) {
    throw new Error("No backend URL configured.");
  }

  // The base already includes /v1.
  // Never add /v1 to these paths.
  const url = backend + "/" + path.replace(/^\/+/, "");

  const headers = new Headers(options.headers || {});

  if (apiKey) {
    headers.set("Authorization", "Bearer " + apiKey);
  }

  if (options.body && !headers.has("Content-Type")) {
    headers.set("Content-Type", "application/json");
  }

  try {
    return await fetch(url, {
      ...options,
      headers
    });
  } catch (error) {
    if (error instanceof TypeError) {
      throw new Error(
        "Network or CORS error. Check your gateway URL and CORS configuration."
      );
    }

    throw error;
  }
}

async function parseResponse(response) {
  const text = await response.text();

  let data;

  try {
    data = text ? JSON.parse(text) : {};
  } catch {
    data = { detail: text };
  }

  if (!response.ok) {
    throw new Error(
      data.detail || data.message || data.error || response.statusText
    );
  }

  return data;
}

/* =========================================================
   CHAT UI
========================================================= */

function removeEmpty() {
  const empty = document.getElementById("empty");
  if (empty) empty.remove();
}

function addMessage(role, content) {
  removeEmpty();

  const chat = document.getElementById("chat");
  const div = document.createElement("div");

  div.className = "message " + role;

  const label = document.createElement("div");
  label.className = "role";
  label.textContent = role === "user" ? "You" : "Codete";

  const body = document.createElement("div");
  body.textContent = content;

  div.appendChild(label);
  div.appendChild(body);

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  return body;
}

function newChat() {
  messages = [];

  document.getElementById("chat").innerHTML = `
    <div id="empty">
      <h1>What are we building?</h1>
      <p>Start a conversation with Codete.</p>
    </div>
  `;
}

document.getElementById("newChat").onclick = newChat;

const input = document.getElementById("input");

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

/* =========================================================
   CHAT REQUEST
========================================================= */

async function sendMessage() {
  if (busy) return;

  const text = input.value.trim();

  if (!text) return;

  if (!apiKey) {
    openAuth("signin");
    return;
  }

  if (!base()) {
    alert("No backend is configured.");
    return;
  }

  busy = true;
  document.getElementById("send").disabled = true;

  input.value = "";
  input.style.height = "auto";

  addMessage("user", text);

  messages.push({
    role: "user",
    content: text
  });

  const responseBody = addMessage("assistant", "Thinking...");

  try {
    const response = await apiFetch("chat/completions", {
      method: "POST",
      body: JSON.stringify({
        model: document.getElementById("model").value,
        messages: messages
      })
    });

    const tokensUsed = response.headers.get("X-Codete-Tokens-Used");
    const tokensLeft = response.headers.get("X-Codete-Tokens-Left");

    const data = await parseResponse(response);

    let reply = "";

    if (data.choices && data.choices.length) {
      reply = data.choices[0].message?.content || "";
    } else {
      reply = data.response || data.message || JSON.stringify(data);
    }

    responseBody.textContent = reply || "(Empty response)";

    messages.push({
      role: "assistant",
      content: reply
    });

    if (tokensUsed !== null || tokensLeft !== null) {
      updateStatus(
        "Used: " + (tokensUsed ?? "?") +
        " · Remaining: " + (tokensLeft ?? "?")
      );
    }

  } catch (error) {
    responseBody.textContent = "Error: " + error.message;
    messages.pop();
    console.error(error);

  } finally {
    busy = false;
    document.getElementById("send").disabled = false;
    input.focus();
  }
}

document.getElementById("send").onclick = sendMessage;

/* =========================================================
   MODAL
========================================================= */

function openModal(title, content, buttons, linkContent = "") {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalContent").innerHTML = content;
  document.getElementById("modalLinkRow").innerHTML = linkContent;

  const buttonArea = document.getElementById("modalButtons");
  buttonArea.innerHTML = "";

  for (const button of buttons) {
    const b = document.createElement("button");
    b.textContent = button.label;
    b.onclick = button.action;
    buttonArea.appendChild(b);
  }

  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

/* =========================================================
   AUTH
========================================================= */

function openAuth(mode = "signin") {
  const signup = mode === "signup";

  openModal(
    signup ? "Create account" : "Sign in",
    `
      <input
        id="authEmail"
        type="email"
        placeholder="Email address"
        autocomplete="email"
      >

      <input
        id="authPassword"
        type="password"
        placeholder="Password"
        autocomplete="${signup ? "new-password" : "current-password"}"
      >

      <p id="modalNote">
        Authentication is handled by the Codete gateway.
      </p>
    `,
    [
      {
        label: signup ? "Sign up" : "Sign in",
        action: submitAuth
      },
      {
        label: signup ? "Switch to sign in" : "Create account",
        action: () => openAuth(signup ? "signin" : "signup")
      },
      {
        label: "Cancel",
        action: closeModal
      }
    ],
    signup ? "" : `
      <button class="modalLink" onclick="openForgotPassword()">
        Forgot password?
      </button>
    `
  );

  document.getElementById("authEmail").focus();
}

async function submitAuth() {
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;

  if (!email || !password) {
    alert("Enter your email and password.");
    return;
  }

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    alert("Please enter a valid email address.");
    return;
  }

  const signupMode =
    document.getElementById("modalTitle").textContent === "Create account";

  const endpoint = signupMode ? "auth/signup" : "auth/signin";

  try {
    const response = await apiFetch(endpoint, {
      method: "POST",
      body: JSON.stringify({
        email: email,
        password: password
      })
    });

    const data = await parseResponse(response);

    const key =
      data.api_key ||
      data.token ||
      data.access_token;

    if (!key) {
      throw new Error("Server did not return an API key.");
    }

    apiKey = key;
    accountName = data.email || email;

    sessionStorage.setItem("codete_api_key", apiKey);
    sessionStorage.setItem("codete_account", accountName);

    closeModal();
    updateAccount();

    alert("Successfully " + (signupMode ? "signed up" : "signed in") + ".");

  } catch (error) {
    alert(error.message);
  }
}

/* =========================================================
   PASSWORD RECOVERY
========================================================= */

function openForgotPassword() {
  openModal(
    "Reset password",
    `
      <input
        id="recoveryEmail"
        type="email"
        placeholder="Account email"
        autocomplete="email"
      >

      <p id="modalNote">
        Enter the email associated with your Codete account.
        If recovery is configured, PlayFab will send a recovery email.
      </p>
    `,
    [
      {
        label: "Send recovery email",
        action: sendRecoveryEmail
      },
      {
        label: "Back to sign in",
        action: () => openAuth("signin")
      },
      {
        label: "Cancel",
        action: closeModal
      }
    ]
  );

  document.getElementById("recoveryEmail").focus();
}

async function sendRecoveryEmail() {
  const email = document.getElementById("recoveryEmail").value.trim();

  if (!email) {
    alert("Enter your email address.");
    return;
  }

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    alert("Please enter a valid email address.");
    return;
  }

  try {
    const response = await apiFetch("auth/forgot-password", {
      method: "POST",
      body: JSON.stringify({
        email: email
      })
    });

    const data = await parseResponse(response);

    closeModal();

    alert(
      data.message ||
      "If an account is associated with that email, a recovery email may be sent."
    );

  } catch (error) {
    alert("Recovery request failed: " + error.message);
  }
}

/* =========================================================
   ACCOUNT
========================================================= */

function updateAccount() {
  document.getElementById("accountBtn").textContent =
    apiKey ? (accountName || "Account") : "Sign in";
}

document.getElementById("accountBtn").onclick = () => {
  if (!apiKey) {
    openAuth("signin");
    return;
  }

  openModal(
    "Account",
    `<p>Signed in as <strong>${escapeHTML(accountName)}</strong></p>`,
    [
      {
        label: "Sign out",
        action: () => {
          apiKey = "";
          accountName = "";

          sessionStorage.removeItem("codete_api_key");
          sessionStorage.removeItem("codete_account");

          updateAccount();
          closeModal();
        }
      },
      {
        label: "Close",
        action: closeModal
      }
    ]
  );
};

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* =========================================================
   BACKEND SETTINGS
========================================================= */

function openSettings() {
  const current = localStorage.getItem("codete_base") || "";

  openModal(
    "Backend settings",
    `
      <p id="modalNote">
        Codete discovers the gateway through relay.txt.
        You can manually override it here.
      </p>

      <input
        id="backendInput"
        placeholder="https://your-gateway.com"
        value="${escapeHTML(current)}"
      >

      <p id="modalNote">
        Enter the gateway root URL. /v1 is automatically handled.
        Leave blank to use relay discovery.
      </p>
    `,
    [
      {
        label: "Save",
        action: saveSettings
      },
      {
        label: "Reset to relay",
        action: resetSettings
      },
      {
        label: "Cancel",
        action: closeModal
      }
    ]
  );
}

function saveSettings() {
  const value = document.getElementById("backendInput").value.trim();

  if (!value) {
    localStorage.removeItem("codete_base");
    closeModal();
    discoverBackend();
    return;
  }

  try {
    const url = new URL(value);

    if (url.protocol !== "https:" && url.protocol !== "http:") {
      throw new Error("Invalid protocol");
    }

    localStorage.setItem(
      "codete_base",
      url.origin + url.pathname.replace(/\/+$/, "")
    );

    closeModal();
    showBackendStatus();

  } catch {
    alert("Enter a valid HTTP or HTTPS backend URL.");
  }
}

function resetSettings() {
  localStorage.removeItem("codete_base");
  closeModal();
  discoverBackend();
}

document.getElementById("settingsBtn").onclick = openSettings;

/* =========================================================
   STARTUP
========================================================= */

updateAccount();

if (localStorage.getItem("codete_base")) {
  showBackendStatus();
} else {
  discoverBackend();
}
</script>
</body>
</html>
